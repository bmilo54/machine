<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>无影云手机Web SDK 演示</title>
  <script defer src="WuyingWebSDK.js"></script>
  <script src="https://g.alicdn.com/code/lib/axios/1.7.7/axios.min.js"></script>
  <script defer src="cloud-phone.js"></script>
  <link rel="stylesheet" href="cloud-phone.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>无影云手机Web SDK 演示</h1>
      <p class="subtitle">云手机连接与管理平台</p>
    </header>

    <div class="checkbox-group">
        <h2 class="card-title">选择使用云手机方式：</h2>
        <input type="checkbox" id="use_login" >
        <label for="use_login">便携账号使用</label>
        <input type="checkbox" id="use_input">
        <label for="use_input">直连使用</label>
    </div>

    <div class="card" id="loginCard">
      <h2 class="card-title">便携账号登录</h2>
      <div id="loginParams">
        <div class="form-group">
          <label for="loginId">组织ID</label>
          <input type="text" id="loginId" name="loginId" placeholder="请输入组织ID">
        </div>
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" placeholder="请输入密码">
        </div>
        <button class="btn btn-block" id="login-button">登录</button>
      </div>
      
      <div id="logout" style="display: none">
        <p>当前用户: <span id="login-user"></span></p>
        <button class="btn btn-block btn-error" id="logout-button">退出登录</button>
      </div>
    </div>

    <div class="card" id="inputCard" style="display: none;">
      <h2 class="card-title">手动输入参数直连</h2>
      <div class="checkbox-group">
        <input type="checkbox" id="manualParameter">
        <label for="manualParameter">手动输入登录信息及实例信息（备注：Token、AuthCode和Ticket填其一即可）</label>
      </div>
      
      <div id="login-session-info" style="display: none">
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="useTicketConn">
            <label for="useTicketConn">使用Ticket直连【推荐】</label>
          </div>
          <div id="use-ticket-conn-info" style="display: none">
            <div class="form-group">
              <label for="appInstanceId_manual">实例物理会话ID</label>
              <input type="text" id="appInstanceId_manual" name="appInstanceId" placeholder="必填，值以ai-开头">
            </div>
            <div class="form-group">
              <label for="ticket">Ticket</label>
              <input type="text" id="ticket" name="Ticket" placeholder="请输入ticket">
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="groupcontrol">
              <label for="groupcontrol">开启群控</label>
            </div>
            <div class="form-group">
              <label>上传BatchGetAcpConnectionTicket的Response JSON文件来创建缩略图</label>
              <div class="file-input">
                <input type="file" id="fileInput" webkitdirectory multiple style="display: none;">
                <label for="fileInput" class="file-input-label">选择JSON文件</label>
              </div>
            </div>
            <button class="btn" id="thumbnailBtn">添加缩略图流</button>
            <div id="thumbnail-info"></div>
          </div>
        </div>
        
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="useOtherConn">
            <label for="useOtherConn">使用Token或AuthCode直连</label>
          </div>
          <div id="use-other-conn-info" style="display: none">
            <div class="form-group">
                <label for="loginToken">Token直连</label>
                <div class="form-group" style="margin-left: 20px; margin-top: 10px;">
                    <label for="loginToken">LoginToken/stsToken</label>
                    <input type="text" id="loginToken" name="loginToken" placeholder="通过loginToken或stsToken直连">
                </div>
                <div class="form-group" style="margin-left: 20px; margin-top: 10px;">
                    <label for="sessionId">sessionId</label>
                    <input type="text" id="sessionId" name="sessionId" placeholder="使用LoginToken/stsToken则必填，请求loginToken或stsToken得到的SessionId">
                </div>
            </div>
            <div class="form-group">
              <label for="authCode">AuthCode直连</label>
              <input type="text" id="authCode" name="authCode" placeholder="请输入免授权登录下的authCode">
            </div>
            <div class="form-group">
                <label for="resourceId_manual">resourceId</label>
                <input type="text" id="resourceId_manual" name="resourceId" placeholder="必填，实例持久会话ID，以p-开头，通过管控接口DescribeAndroidInstances可获取">
            </div>
            <div class="form-group">
                <label for="appId_manual">appID</label>
                <input type="text" id="appId_manual" name="appId" value="android" placeholder="必填">
            </div>
            <div class="form-group">
                <label for="productType_manual">productType</label>
                <input type="text" id="productType_manual" name="productType" value="AndroidCloud" placeholder="必填">
            </div>
            <div class="form-group">
                <label for="appVersion_manual">appVersion</label>
                <input type="text" id="appVersion_manual" name="appVersion" placeholder="选填，实例版本信息">
            </div>
          </div>
        </div>
        
        <div class="btn-group">
          <button class="btn" id="connect-button">连接</button>
          <button class="btn btn-secondary" id="clear-button">清空</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">启动参数</h2>
      <div class="form-group">
        <div class="radio-group">
          <label><input type="radio" name="openType" value="inline" checked> 内嵌</label>
          <label><input type="radio" name="openType" value="inline-multi"> 内嵌-多屏</label>
          <label><input type="radio" name="openType" value="newTab"> 新页面</label>
          <label><input type="radio" name="openType" value="urlScheme"> 客户端打开</label>
        </div>
      </div>
      
      <div class="form-group">
        <div class="radio-group">
          <label><input type="radio" name="resourceType" value="local" checked> 本地资源页面</label>
        </div>
      </div>
      
      <div class="form-group">
        <div class="radio-group">
          <label><input type="radio" name="quality" value="low"> 低清</label>
          <label><input type="radio" name="quality" value="normal" checked> 标准</label>
          <label><input type="radio" name="quality" value="high"> 高清</label>
          <label><input type="radio" name="quality" value="super"> 超清</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="hideProgressDialog">
          <label for="hideProgressDialog">隐藏上传下载进度</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="setCloudPhoneLoading">
          <label for="setCloudPhoneLoading">设置云手机加载动画</label>
        </div>
      </div>
      
      <div class="form-group">
        <label>连接配置 (JSON格式)</label>
        <textarea id="connConfig" name="connConfig" rows="3" placeholder='{"disableCamera": true, "decodeType": 2}'></textarea>
      </div>
      
      <div class="btn-group">
        <button class="btn btn-error" id="disconnect-button">断开连接</button>
        <button class="btn" id="hide-ball-button">显隐悬浮球</button>
        <button class="btn" id="network-data-button">获取性能参数</button>
        <button class="btn" id="resolution-button">修改分辨率<br><span class="sub-text">针对实例版</span></button>
        <button class="btn" id="screenshot-button">获取截图</button>
        <button class="btn" id="download-button">下载云手机文件到本地</button>
      </div>
      
      <div class="form-group" style="margin-top: 16px;">
        <label>上传本地文件到云手机</label>
        <div class="file-input">
          <input type="file" id="uploadFile" multiple style="display: none;">
          <label for="uploadFile" class="file-input-label">选择要上传的文件</label>
        </div>
      </div>
      
      <div class="btn-group" style="margin-top: 16px;">
        <button class="btn" id="transfer-info-button">文件传输信息</button>
        <button class="btn" id="graphic-low-button">设置低清</button>
        <button class="btn" id="graphic-super-button">设置超清</button>
        <button class="btn" id="disable-touch-button">关闭Touch输入</button>
      </div>
      
      <div class="btn-group" style="margin-top: 16px;">
        <button class="btn" id="vol-down-button">音量减小</button>
        <button class="btn" id="vol-up-button">音量增大</button>
        <button class="btn" id="mute-button">云机静音</button>
        <button class="btn" id="mute-button2">端侧静音</button>
        <button class="btn" id="unmute-button2">取消端侧静音</button>
        <button class="btn" id="back-button">返回</button>
        <button class="btn" id="home-button">主页</button>
        <button class="btn" id="app-switch-button">近期任务</button>
        <button class="btn" id="hide-nav-button">隐藏导航栏</button>
        <button class="btn" id="show-nav-button">显示导航栏</button>
        <button class="btn" id="clipboard-send-button">发送数据到云机剪贴板</button>
        <button class="btn" id="clipboard-modal-button">剪贴板</button>
      </div>
    </div>

    <div class="card" id="appsInfos" style="display: none;">
      <h2 class="card-title">云手机列表</h2>
      <div class="btn-group">
        <button class="btn" id="get-app-list">获取云手机列表</button>
        <button class="btn btn-secondary" id="clear-app-list">清空云手机列表</button>
      </div>
      <div id="applist" class="app-list"></div>
    </div>

    <div class="card">
      <h2 class="card-title">云手机画面</h2>
      <div class="desktop-container">
        <iframe id="sessionIframe"></iframe>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">缩略图预览</h2>
      <div id="thumbnail-container" class="thumbnail-container"></div>
    </div>
  </div>

  <div id="notification" class="notification"></div>
</body>
</html>
